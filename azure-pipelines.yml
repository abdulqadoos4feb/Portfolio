trigger:
  branches:
    include:
      - main

variables:
  # Variable group linked to Key Vault (or plain variable group) - must contain:
  #   ACR_LOGIN_SERVER, ACR_USERNAME, ACR_PASSWORD
  - group: web-app-secrets
  - name: imageRepository
    value: 'mywebapp'
  - name: tag
    value: '$(Build.BuildId)'

pool:
  name: 'OracleSelfHosted'   # name of the self-hosted agent pool you register on VM-B

stages:

# ─────────────────────────────────────────────────────────────
# STAGE 1 — Build the image, push to ACR, publish deploy bundle
# ─────────────────────────────────────────────────────────────
- stage: Build
  displayName: Build and Push Image
  jobs:
  - job: BuildAndPush
    displayName: Build & push to ACR
    steps:
    - task: Docker@2
      displayName: Build and push php-fpm image to ACR
      inputs:
        containerRegistry: 'acr-service-connection'   # Docker Registry service connection (see SETUP-GUIDE.md)
        repository: '$(imageRepository)-php'
        command: 'buildAndPush'
        Dockerfile: 'docker/php/Dockerfile'
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          $(tag)
          latest

    - task: Docker@2
      displayName: Build and push nginx image to ACR
      inputs:
        containerRegistry: 'acr-service-connection'
        repository: '$(imageRepository)-nginx'
        command: 'buildAndPush'
        Dockerfile: 'docker/nginx/Dockerfile'
        buildContext: '$(Build.SourcesDirectory)'
        tags: |
          $(tag)
          latest

    - task: CopyFiles@2
      displayName: Stage deployment files
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)'
        Contents: |
          docker-compose.yml
          deploy/**
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: PublishPipelineArtifact@1
      displayName: Publish deploy artifact (used by Deploy stage)
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'deploy-package'
        publishLocation: 'pipeline'

    - task: UniversalPackages@0
      displayName: Publish deploy bundle to Azure Artifacts
      inputs:
        command: publish
        publishDirectory: '$(Build.ArtifactStagingDirectory)'
        vstsFeedPublish: 'webapp-artifacts'          # create this feed first, see SETUP-GUIDE.md
        vstsFeedPackagePublish: 'webapp-deploy-package'
        versionOption: 'patch'

# ─────────────────────────────────────────────────────────────
# STAGE 2 — Deploy to the Oracle target VM over SSH
# ─────────────────────────────────────────────────────────────
- stage: Deploy
  displayName: Deploy to Oracle VM
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployWeb
    displayName: Deploy container to VM-A
    environment: 'production'   # create this Environment in Azure DevOps (no approval, per your choice)
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: deploy-package

          - task: SSH@0
            displayName: Ensure deploy directory + .env exist on VM-A
            inputs:
              sshEndpoint: 'oracle-vm-a-ssh'
              runOptions: 'commands'
              commands: |
                sudo mkdir -p /opt/mywebapp
                sudo chown $(whoami):$(whoami) /opt/mywebapp

          - task: CopyFilesOverSSH@0
            displayName: Copy docker-compose.yml to VM-A
            inputs:
              sshEndpoint: 'oracle-vm-a-ssh'
              sourceFolder: '$(Pipeline.Workspace)/deploy-package'
              contents: 'docker-compose.yml'
              targetFolder: '/opt/mywebapp'

          - task: SSH@0
            displayName: Login to ACR, pull image, restart containers
            inputs:
              sshEndpoint: 'oracle-vm-a-ssh'
              runOptions: 'commands'
              commands: |
                echo "$(ACR_PASSWORD)" | docker login $(ACR_LOGIN_SERVER) -u $(ACR_USERNAME) --password-stdin
                cd /opt/mywebapp
                echo "ACR_LOGIN_SERVER=$(ACR_LOGIN_SERVER)" > .env
                echo "IMAGE_TAG=$(tag)" >> .env
                docker compose pull
                docker compose up -d
                docker image prune -f
