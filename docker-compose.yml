version: "3.8"

services:
  app:
    image: ${ACR_LOGIN_SERVER}/mywebapp-php:${IMAGE_TAG}
    container_name: mywebapp-app
    restart: unless-stopped
    expose:
      - "9000"

  web:
    image: ${ACR_LOGIN_SERVER}/mywebapp-nginx:${IMAGE_TAG}
    container_name: mywebapp-web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
